# SHD-05 lab: Citus (Postgres sharding) — 1 coordinator + 2 worker.
# 1) docker compose -f docker-compose.yml up -d
# 2) đăng ký worker + tạo bảng distributed + seed:
#    docker compose exec -T coordinator psql -U sa -d edtech < setup.sql
name: sa-labs-citus

services:
  coordinator:
    image: citusdata/citus:12.1
    ports: ["5500:5432"] # nối từ host: psql -h localhost -p 5500 -U sa edtech
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: edtech
    labels: ["com.citusdata.role=Coordinator"]

  worker1:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: edtech
    labels: ["com.citusdata.role=Worker"]

  worker2:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: edtech
    labels: ["com.citusdata.role=Worker"]
