# SA Labs — môi trường thực hành cho các node trong app.
# Chạy: docker compose up -d   (Postgres + Redis + MinIO + demo API)
# Load test: docker compose run --rm k6 run /scripts/course-load.js
# Kafka (nâng cao, cho CQRS/SYN-A): docker compose --profile kafka up -d kafka
name: sa-labs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: edtech
    ports: ["55432:5432"] # host 55432 (tránh đụng Postgres 5432 đang chạy); psql -h localhost -p 55432 -U sa edtech
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d edtech"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["56379:6379"] # host 56379 (tránh đụng Redis 6379 đang chạy); redis-cli -p 56379

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"] # API 9000, Console 9001 (S3-compatible → INF-10)
    volumes:
      - miniodata:/data

  # Demo API cho lab CSH-04 (cache) + TST-11 (load) + FLT-09 (idempotency).
  # Bật/tắt cache bằng biến USE_CACHE (0/1) rồi so p99.
  api:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgres://sa:sa@postgres:5432/edtech
      REDIS_URL: redis://redis:6379
      USE_CACHE: "0"      # đổi thành "1" rồi `docker compose up -d api` để bật cache-aside
      CACHE_TTL: "60"
      PG_POOL: "10"
      PORT: "8080"
    ports: ["8081:8080"] # truy cập TRỰC TIẾP api ở host 8081 (bỏ qua gateway) để so sánh
    volumes:
      - ./api:/app
    command: sh -c "npm install --no-audit --no-fund --silent && node server.js"

  # GTW-06: API Gateway (Nginx) + rate-limit, đứng trước api. Host 8080 → gateway.
  gateway:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["8080:8080"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  k6:
    image: grafana/k6:latest
    profiles: ["tools"]   # không tự chạy; gọi bằng `docker compose run --rm k6 run ...`
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./k6:/scripts

  # KRaft single-node — chỉ cho lab CQRS/SYN-A. Bật: docker compose --profile kafka up -d kafka
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # OBS-14: Prometheus + Grafana. Bật: docker compose --profile obs up -d prometheus grafana
  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    depends_on: [api]
    ports: ["9090:9090"]
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    depends_on: [prometheus]
    ports: ["3300:3000"] # host 3300 (tránh 3000/3001 đang bận); mở http://localhost:3300
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  miniodata:
