# GTW-06 lab: API Gateway (reverse proxy) + rate-limit.
worker_processes 1;
events { worker_connections 1024; }

http {
  # Rate-limit: 5 req/s mỗi IP, cho phép dồn (burst) 10 rồi mới chặn.
  limit_req_zone $binary_remote_addr zone=apilimit:10m rate=5r/s;

  upstream api_upstream { server api:8080; }

  server {
    listen 8080;

    location / {
      limit_req zone=apilimit burst=10 nodelay;
      limit_req_status 429;              # vượt hạn → HTTP 429 Too Many Requests
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Served-By "gateway" always;
    }
  }
}
